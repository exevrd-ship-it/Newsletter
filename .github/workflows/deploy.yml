# Publishes the site on GitHub Pages every time the default branch changes.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Publish website

on:
  push:
  workflow_dispatch:
  # Every Sunday at 09:00 UTC (10:00 in Paris in winter, 11:00 in summer):
  # publishes issues that were written in advance with a future date.
  schedule:
    - cron: "0 9 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build issues from issues/*.md
        run: node tools/build-issues.mjs
      - name: Apply config.js to the pages
        run: node tools/apply-config.mjs
      - name: Prepare files
        run: |
          mkdir _site
          cp -r *.html config.js css js assets .nojekyll _site/
          cp sitemap.xml robots.txt _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
